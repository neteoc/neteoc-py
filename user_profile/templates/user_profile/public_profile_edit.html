{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fa fa-user-edit me-2"></i>Edit Public Profile
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <div class="d-flex justify-content-between mt-3">
                            <a href="{% url 'user_profile:profile' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Public Info</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="alert alert-info">
                <i class="fa fa-info-circle"></i>
                <strong>Note:</strong> Public profile info is only visible to members of your organizations and users checked in to incidents you command.
            </div>
        </div>
    </div>
{% endblock content %}
