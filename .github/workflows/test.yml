name: Django Tests

on:
  push:
    branches: [ "main", "asset-tracking" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write

env:
  DJANGO_SETTINGS_MODULE: neteoc.settings
  DJANGO_DEBUG: false
  DJANGO_SECRET_KEY: "test-secret-key-for-github-actions"
  DATABASE_URL: "sqlite:///test.db"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gdal-bin \
          libgdal-dev \
          libproj-dev \
          libgeos-dev \
          libspatialite8t64 \
          spatialite-bin \
          libxml2-dev \
          libxmlsec1-dev \
          libxmlsec1-openssl \
          pkg-config

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python dependencies
      run: |
        uv sync --frozen

    - name: Lint with ruff
      run: |
        uv run ruff check .

    - name: Format check with ruff
      run: |
        uv run ruff format --check .

    - name: Run Django system checks
      run: |
        uv run python manage.py check --deploy

    - name: Run Django migrations
      run: |
        uv run python manage.py migrate

    - name: Collect static files
      run: |
        uv run python manage.py collectstatic --noinput

    - name: Run unit tests
      run: |
        uv run python manage.py test --verbosity=2

    - name: Run specific operations tests
      run: |
        uv run python manage.py test operations --verbosity=2

    - name: Generate coverage report
      run: |
        uv run coverage run --source='.' manage.py test
        uv run coverage report --show-missing
        uv run coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_neteoc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: neteoc.settings
      DJANGO_DEBUG: false
      DJANGO_SECRET_KEY: "test-secret-key-for-github-actions"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/test_neteoc"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gdal-bin \
          libgdal-dev \
          libproj-dev \
          libgeos-dev \
          libpq-dev \
          postgresql-client \
          libxml2-dev \
          libxmlsec1-dev \
          libxmlsec1-openssl \
          pkg-config

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python dependencies
      run: |
        uv sync --frozen

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done

    - name: Run Django migrations
      run: |
        uv run python manage.py migrate

    - name: Run unit tests with PostgreSQL
      run: |
        uv run python manage.py test --verbosity=2

    - name: Run operations tests with PostgreSQL
      run: |
        uv run python manage.py test operations --verbosity=2

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python dependencies
      run: |
        uv sync --frozen

    - name: Run Bandit security scan
      run: |
        uv run bandit -r . --config .bandit -f json -o bandit-report.json
        uv run bandit -r . --config .bandit

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
