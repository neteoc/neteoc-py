[project]
name = "neteoc-py"
version = "0.1.0"
description = "This project aims to collect, correlate, track, and disseminate information during a disaster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.0.1",
    "django-allauth[socialaccount]>=65.10.0",
    "django-bootstrap5>=25.2",
    "django-easy-logging>=0.70",
    "django-maintenance-mode>=0.22.0",
    "django-tables2>=2.7.5",
    "django-tiles-gl>=0.3.9",
    "django>=5.2.4",
    "geopy>=2.4.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.9",
    "python-decouple>=3.8",
    "wagtail>=7.0.2",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "cookiecutter>=2.6.0",
    "honcho>=2.0.0",
    "pre-commit>=4.2.0",
    "ruff>=0.12.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
