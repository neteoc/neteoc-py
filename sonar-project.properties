# SonarQube project configuration for NetEOC Django application

# Project identification
sonar.projectKey=neteoc_neteoc-py
sonar.projectName=NetEOC Python
sonar.projectVersion=0.1.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/static/**,**/media/**,**/.venv/**,**/venv/**,**/.git/**,**/node_modules/**,**/.ruff_cache/**,**/uv.lock,**/requirements.txt

# Python-specific configuration
sonar.python.version=3.12

# Test configuration (if you have tests in the future)
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests.py,**/tests/**/*.py
sonar.test.exclusions=**/migrations/**,**/__pycache__/**,**/static/**,**/media/**

# Coverage configuration (for future test coverage)
# sonar.python.coverage.reportPaths=coverage.xml

# Django-specific exclusions for better analysis
sonar.coverage.exclusions=**/migrations/**,**/settings.py,**/wsgi.py,**/asgi.py,manage.py

# Language configuration
sonar.sourceEncoding=UTF-8
